services:
  # REST API server for shopmind.app
  api:
    build: .
    container_name: scraper-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8066:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - SCRAPER_OUTPUT_DIR=/app/data
      - SCRAPER_CONFIG=/app/config/sites.yaml
      - SCRAPER_LOG_LEVEL=INFO
      - SCRAPER_API_KEY=${SCRAPER_API_KEY:-}
      - SCRAPER_CACHE_TTL=3600
    entrypoint: ["uvicorn", "scraper.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CLI scraper for on-demand runs
  scraper:
    build: .
    container_name: eu-price-scraper
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - SCRAPER_OUTPUT_DIR=/app/data
      - SCRAPER_CONFIG=/app/config/sites.yaml
      - SCRAPER_LOG_LEVEL=INFO
    # Default: scrape top products from all countries
    command: ["top", "--countries", "all", "--format", "json"]
    profiles:
      - cli

  # Scheduled scraping - runs every 6 hours
  scraper-cron:
    build: .
    container_name: scraper-cron
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - SCRAPER_OUTPUT_DIR=/app/data
      - SCRAPER_CONFIG=/app/config/sites.yaml
    entrypoint: >
      sh -c "
        echo '0 */6 * * * cd /app && python -m scraper.cli top --countries all --format json >> /var/log/scraper.log 2>&1' > /etc/crontab &&
        crontab /etc/crontab &&
        cron -f
      "
    profiles:
      - cron
